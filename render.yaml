services:
  - type: web
    name: guesswhat-game-server
    runtime: node
    buildCommand: npm install --include=optional --force --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
